
<!DOCTYPE html>
<html lang="ko">
<head>

  <title>렌트마스터 - 신차 장기렌트 견적</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

    <h1>렌트마스터</h1>

    <form action="https://forms.gle/your-form-link" target="_blank">
      <label for="car">원하는 차량</label>
      <select id="car" name="car">
        <option value="현대 아반떼">현대 아반떼</option>
        <option value="기아 쏘렌토">기아 쏘렌토</option>
        <option value="테슬라 모델3">테슬라 모델3</option>
      </select>
      <br />
      <button type="submit">견적 신청하기</button>
    </form>
  </div>
</body>
</html>
